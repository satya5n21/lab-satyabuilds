<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070912" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <title>Not found · Satyabuilds Lab</title>
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            place-items: center;
            background: radial-gradient(ellipse at 50% -24%, rgb(96 55 180 / 24%), transparent 58%), #070912;
            color: #f4f5ff;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        main {
            max-width: 440px;
        }

        .code {
            margin: 0 0 12px;
            color: #a4aac0;
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 14px;
            font-size: clamp(2rem, 7vw, 3rem);
            letter-spacing: -0.05em;
            line-height: 1.05;
        }

        p {
            margin: 0 0 28px;
            color: #a4aac0;
            line-height: 1.7;
        }

        a {
            display: inline-block;
            padding: 10px 16px;
            border: 1px solid rgb(255 255 255 / 14%);
            border-radius: 10px;
            background: rgb(255 255 255 / 4%);
            color: #f4f5ff;
            font-size: 0.85rem;
            font-weight: 700;
            text-decoration: none;
        }

        a:hover,
        a:focus-visible {
            border-color: rgb(114 255 200 / 45%);
            color: #72ffc8;
            outline: none;
        }
    </style>
</head>

<body>
    <main>
        <p class="code">Error 404</p>
        <h1>This experiment doesn't exist (yet).</h1>
        <p>The page you were looking for isn't here. It may have moved, or it hasn't been built.</p>
        <a href="/">← Back to the lab</a>
    </main>
</body>

</html>
