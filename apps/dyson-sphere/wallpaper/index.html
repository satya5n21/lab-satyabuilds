<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dyson Sphere Explorer - Wallpaper</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #03050a;
            user-select: none;
            -webkit-user-select: none;
        }

        #viewport-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0a1226 0%, #040710 65%, #020307 100%);
        }

        canvas#scene-canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: grab;
        }

        canvas#scene-canvas:active {
            cursor: grabbing;
        }

        .vignette-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 55%, rgba(2, 4, 9, 0.65) 100%);
            z-index: 2;
            transition: opacity 0.3s;
        }

        .vignette-overlay.off {
            opacity: 0;
        }

        #input-debug {
            display: none;
            position: fixed;
            left: 16px;
            top: 16px;
            z-index: 10;
            padding: 8px 12px;
            font: 12px/1.5 Consolas, monospace;
            color: #9ff5de;
            background: rgba(7, 13, 26, 0.85);
            border: 1px solid rgba(60, 230, 255, 0.35);
            border-radius: 6px;
            pointer-events: none;
            white-space: pre;
        }

        #renderer-notice {
            display: none;
            position: fixed;
            left: 16px;
            bottom: 16px;
            z-index: 5;
            padding: 6px 10px;
            font: 11px Consolas, monospace;
            letter-spacing: 0.08em;
            color: #ffd478;
            background: rgba(7, 13, 26, 0.78);
            border: 1px solid rgba(245, 166, 35, 0.4);
            border-radius: 6px;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div id="viewport-container">
        <canvas id="scene-canvas" aria-label="Interactive 3D Dyson Sphere"></canvas>
    </div>
    <div class="vignette-overlay" id="vignette"></div>
    <div id="input-debug"></div>
    <div id="renderer-notice">WEBGL UNAVAILABLE - 2D FALLBACK</div>

    <!-- Bundled locally (r128) so the wallpaper works offline -->
    <script src="./three.min.js"></script>

    <script>
        (function () {
            'use strict';

            /* ==========================================================================
             * 1. MOBILE-FIRST PERFORMANCE ADAPTATION & APPLICATION STATE
             * ========================================================================== */
            function detectPerformanceProfile() {
                // Wallpaper build: always a desktop profile. A wallpaper is chosen on purpose, so the
                // OS "reduce motion" flag is ignored (use the Auto rotate / Collector motion options).
                var isSmallScreen = false;
                var cores = navigator.hardwareConcurrency || 4;
                var deviceMemory = navigator.deviceMemory || 4;
                var prefersReducedMotion = false;

                var isLowTier = isSmallScreen && (cores <= 4 || deviceMemory <= 4);
                var rawDpr = window.devicePixelRatio || 1;
                // Cap mobile pixel ratio strictly at 1.0 to avoid tile-GPU fill-rate bottlenecks
                var maxPixelRatio = isSmallScreen ? 1.0 : Math.min(rawDpr, 1.35);

                return {
                    isMobile: isSmallScreen,
                    isLowTier: isLowTier,
                    pixelRatio: maxPixelRatio,
                    // Keep collector counts visually rich while bounded for mobile GPUs
                    maxCollectors: isLowTier ? 1800 : (isSmallScreen ? 2400 : 3600),
                    defaultCollectors: isLowTier ? 1100 : (isSmallScreen ? 1300 : 1600),
                    starCount: isLowTier ? 600 : (isSmallScreen ? 900 : 1600),
                    prefersReducedMotion: Boolean(prefersReducedMotion)
                };
            }

            var profile = detectPerformanceProfile();

            var appState = {
                mode: 'swarm', // 'swarm' | 'shell'
                collectorCount: profile.defaultCollectors,
                maxCollectors: profile.maxCollectors,
                orbitalRadius: 1.0,      // Normalized AU (1.0 AU = 6.5 scene units)
                starIntensity: 1.0,      // Normalized solar luminosity L_sun
                collectorMotion: !profile.prefersReducedMotion,
                showOrbitalPaths: true,
                autoRotate: !profile.prefersReducedMotion,
                paused: false,
                uiHidden: false,
                tabHidden: Boolean(document.hidden),
                timeScale: 1.0,          // collector orbit speed multiplier
                pixelRatio: 0,           // 0 = use the performance profile; set by the Quality property
                needsRender: true,
                collectorsDirty: true
            };

            var BASE_ORBIT_SCENE_UNITS = 6.5;
            var SOLAR_LUMINOSITY_WATTS = 3.828e26;

            /* ==========================================================================
             * 2. TELEMETRY & EDUCATIONAL ENERGY MODEL
             * ========================================================================== */
            function computeTelemetry(state) {
                var r = Math.max(0.2, state.orbitalRadius);
                var sphereArea = 4.0 * Math.PI * r * r;

                var perUnitArea = state.mode === 'swarm' ? 0.001115 : 0.00335;
                var effectiveCollectorArea = state.collectorCount * perUnitArea;

                var rawFraction = effectiveCollectorArea / sphereArea;
                var maxClamp = state.mode === 'swarm' ? 0.78 : 0.985;
                var capturedFraction = Math.min(maxClamp, Math.max(0.0001, rawFraction));

                var totalStarWatts = SOLAR_LUMINOSITY_WATTS * state.starIntensity;
                var capturedWatts = totalStarWatts * capturedFraction;

                var kardashevIndex = (Math.log10(Math.max(1e6, capturedWatts)) - 6.0) / 10.0;

                return {
                    capturedFraction: capturedFraction,
                    capturedWatts: capturedWatts,
                    kardashevIndex: kardashevIndex
                };
            }

            function formatScientificWatts(watts) {
                var exp = Math.floor(Math.log10(watts));
                var mantissa = watts / Math.pow(10, exp);
                var superscripts = {
                    '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴',
                    '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹'
                };
                var expStr = String(exp).split('').map(function (c) {
                    return superscripts[c] || c;
                }).join('');
                return mantissa.toFixed(2) + ' × 10' + expStr + ' W';
            }

            /* ==========================================================================
             * 3. CAMERA CONTROLLER (SMOOTH SPHERICAL ORBIT + TOUCH PINCH + DAMPING)
             * ========================================================================== */
            function createCameraController(canvas, onCameraChange) {
                var DEFAULT_THETA = 0.62;
                var DEFAULT_PHI = 1.18;
                var DEFAULT_DISTANCE = 13.8;

                var controller = {
                    theta: DEFAULT_THETA,
                    phi: DEFAULT_PHI,
                    distance: DEFAULT_DISTANCE,
                    targetTheta: DEFAULT_THETA,
                    targetPhi: DEFAULT_PHI,
                    targetDistance: DEFAULT_DISTANCE,
                    minDistance: 4.4,
                    maxDistance: 27.0,
                    minPhi: 0.14,
                    maxPhi: Math.PI - 0.14,
                    isDragging: false,
                    lastInteractionTime: 0,
                    activePointers: new Map(),
                    lastPinchDist: 0,

                    // Wallpaper options
                    enabled: true,           // false = ignore drag/zoom input entirely
                    inertia: true,           // keep spinning briefly after release
                    autoRotateSpeed: 1.0,    // multiplier on the idle drift
                    idleDelayMs: 1200,       // pause before auto-rotate resumes after interaction
                    defaultDistance: DEFAULT_DISTANCE,
                    velTheta: 0,
                    velPhi: 0,
                    lastMoveTime: 0,

                    setDefaultDistance: function (d) {
                        this.defaultDistance = Math.max(this.minDistance, Math.min(this.maxDistance, d));
                        this.targetDistance = this.defaultDistance;
                        onCameraChange();
                    },

                    reset: function () {
                        this.targetTheta = DEFAULT_THETA;
                        this.targetPhi = DEFAULT_PHI;
                        this.targetDistance = this.defaultDistance;
                        this.velTheta = 0;
                        this.velPhi = 0;
                        onCameraChange();
                    },

                    zoomStep: function (deltaFactor) {
                        this.targetDistance = Math.max(
                            this.minDistance,
                            Math.min(this.maxDistance, this.targetDistance * deltaFactor)
                        );
                        this.lastInteractionTime = performance.now();
                        onCameraChange();
                    },

                    update: function (dt, autoRotateActive) {
                        var now = performance.now();
                        var timeSinceInteract = now - this.lastInteractionTime;

                        var hasMomentum = false;
                        if (!this.isDragging && (this.velTheta !== 0 || this.velPhi !== 0)) {
                            this.targetTheta += this.velTheta * dt;
                            this.targetPhi = Math.max(this.minPhi, Math.min(this.maxPhi, this.targetPhi + this.velPhi * dt));
                            var decay = Math.exp(-2.6 * dt);
                            this.velTheta *= decay;
                            this.velPhi *= decay;
                            if (Math.abs(this.velTheta) < 0.01 && Math.abs(this.velPhi) < 0.01) {
                                this.velTheta = 0;
                                this.velPhi = 0;
                            }
                            hasMomentum = true;
                            this.lastInteractionTime = now;
                        }

                        if (autoRotateActive && !this.isDragging && !hasMomentum && timeSinceInteract > this.idleDelayMs) {
                            this.targetTheta += dt * 0.085 * this.autoRotateSpeed;
                        }

                        var smoothing = 1.0 - Math.exp(-12.0 * dt);
                        var dTheta = this.targetTheta - this.theta;
                        var dPhi = this.targetPhi - this.phi;
                        var dDist = this.targetDistance - this.distance;

                        this.theta += dTheta * smoothing;
                        this.phi += dPhi * smoothing;
                        this.distance += dDist * smoothing;

                        var stillMoving =
                            hasMomentum ||
                            Math.abs(dTheta) > 0.00008 ||
                            Math.abs(dPhi) > 0.00008 ||
                            Math.abs(dDist) > 0.0005;

                        return stillMoving;
                    },

                    getCartesianPosition: function () {
                        var sinPhi = Math.sin(this.phi);
                        return {
                            x: this.distance * sinPhi * Math.sin(this.theta),
                            y: this.distance * Math.cos(this.phi),
                            z: this.distance * sinPhi * Math.cos(this.theta)
                        };
                    }
                };

                // ---- Input -------------------------------------------------------------------------
                // Wallpaper Engine feeds the page synthetic mouse input (CEF), so this is deliberately
                // tolerant: pointer events AND plain mouse events both work (whichever arrives first
                // for a drag wins), nothing relies on pointer capture, and the `buttons` field is only
                // trusted once the host has proven it reports it. Listeners sit on window so they
                // still fire if the event target differs.
                var dragSource = null;       // 'pointer' | 'mouse' while a drag is active
                var buttonsReliable = false; // true once a move event reported a pressed button

                function beginDrag(id, x, y) {
                    if (!controller.enabled) return;
                    controller.velTheta = 0;
                    controller.velPhi = 0;
                    controller.activePointers.set(id, { x: x, y: y });
                    controller.isDragging = true;
                    controller.lastMoveTime = 0;
                    controller.lastInteractionTime = performance.now();
                    if (controller.activePointers.size === 2) {
                        var pts = Array.from(controller.activePointers.values());
                        controller.lastPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                    }
                    onCameraChange();
                }

                function moveDrag(id, x, y) {
                    if (!controller.activePointers.has(id)) return;
                    var prev = controller.activePointers.get(id);
                    var curr = { x: x, y: y };
                    controller.activePointers.set(id, curr);
                    var nowMs = performance.now();
                    var evDt = Math.max(0.004, (nowMs - (controller.lastMoveTime || nowMs)) / 1000.0);
                    controller.lastMoveTime = nowMs;
                    controller.lastInteractionTime = nowMs;

                    if (controller.activePointers.size === 1) {
                        var dx = curr.x - prev.x;
                        var dy = curr.y - prev.y;
                        var rotSpeed = 0.0055;
                        var prevPhiTarget = controller.targetPhi;
                        controller.targetTheta -= dx * rotSpeed;
                        controller.targetPhi = Math.max(
                            controller.minPhi,
                            Math.min(controller.maxPhi, controller.targetPhi - dy * rotSpeed)
                        );
                        // Smoothed angular velocity (rad/s) used for release momentum
                        var instTheta = (-dx * rotSpeed) / evDt;
                        var instPhi = (controller.targetPhi - prevPhiTarget) / evDt;
                        controller.velTheta = controller.velTheta * 0.6 + instTheta * 0.4;
                        controller.velPhi = controller.velPhi * 0.6 + instPhi * 0.4;
                        onCameraChange();
                    } else if (controller.activePointers.size === 2) {
                        var pts = Array.from(controller.activePointers.values());
                        var dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                        if (controller.lastPinchDist > 10) {
                            var ratio = controller.lastPinchDist / Math.max(10, dist);
                            controller.targetDistance = Math.max(
                                controller.minDistance,
                                Math.min(controller.maxDistance, controller.targetDistance * ratio)
                            );
                            onCameraChange();
                        }
                        controller.lastPinchDist = dist;
                    }
                }

                function endDrag(id) {
                    if (!controller.activePointers.has(id)) return;
                    controller.activePointers.delete(id);
                    if (controller.activePointers.size < 2) {
                        controller.lastPinchDist = 0;
                    }
                    if (controller.activePointers.size === 0) {
                        controller.isDragging = false;
                        dragSource = null;
                        buttonsReliable = false;
                        // Only carry momentum if the pointer was still moving when released
                        var sinceMove = performance.now() - controller.lastMoveTime;
                        var maxV = 6.0;
                        if (!controller.inertia || !controller.lastMoveTime || sinceMove > 90) {
                            controller.velTheta = 0;
                            controller.velPhi = 0;
                        } else {
                            controller.velTheta = Math.max(-maxV, Math.min(maxV, controller.velTheta));
                            controller.velPhi = Math.max(-maxV, Math.min(maxV, controller.velPhi));
                        }
                        onCameraChange();
                    }
                    controller.lastInteractionTime = performance.now();
                }

                function onPointerDown(e) {
                    if (dragSource === 'mouse') return;
                    if (e.pointerType === 'mouse' && e.button !== 0) return;
                    dragSource = 'pointer';
                    beginDrag(e.pointerId, e.clientX, e.clientY);
                }

                function onPointerMove(e) {
                    if (dragSource !== 'pointer') return;
                    if (e.pointerType === 'mouse') {
                        // Once this host reports pressed buttons, a move with none held means the
                        // release event was lost (cursor left the desktop, focus change).
                        if (e.buttons !== 0) buttonsReliable = true;
                        else if (buttonsReliable) { endDrag(e.pointerId); return; }
                    }
                    moveDrag(e.pointerId, e.clientX, e.clientY);
                }

                function onPointerUpOrCancel(e) {
                    if (dragSource !== 'pointer') return;
                    endDrag(e.pointerId);
                }

                function onMouseDown(e) {
                    if (dragSource === 'pointer' || e.button !== 0) return;
                    dragSource = 'mouse';
                    beginDrag('mouse', e.clientX, e.clientY);
                }

                function onMouseMove(e) {
                    if (dragSource !== 'mouse') return;
                    if (e.buttons !== 0) buttonsReliable = true;
                    else if (buttonsReliable) { endDrag('mouse'); return; }
                    moveDrag('mouse', e.clientX, e.clientY);
                }

                function onMouseUp() {
                    if (dragSource !== 'mouse') return;
                    endDrag('mouse');
                }

                function onWheel(e) {
                    if (!controller.enabled) return;
                    e.preventDefault();
                    var factor = e.deltaY > 0 ? 1.08 : 0.925;
                    controller.zoomStep(factor);
                }

                window.addEventListener('pointerdown', onPointerDown);
                window.addEventListener('pointermove', onPointerMove);
                window.addEventListener('pointerup', onPointerUpOrCancel);
                window.addEventListener('pointercancel', onPointerUpOrCancel);
                window.addEventListener('mousedown', onMouseDown);
                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('mouseup', onMouseUp);
                window.addEventListener('wheel', onWheel, { passive: false });

                controller.dispose = function () {
                    window.removeEventListener('pointerdown', onPointerDown);
                    window.removeEventListener('pointermove', onPointerMove);
                    window.removeEventListener('pointerup', onPointerUpOrCancel);
                    window.removeEventListener('pointercancel', onPointerUpOrCancel);
                    window.removeEventListener('mousedown', onMouseDown);
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('mouseup', onMouseUp);
                    window.removeEventListener('wheel', onWheel);
                };

                return controller;
            }

            /* ==========================================================================
             * 4. ORBITAL & GEOMETRY PRECOMPUTATION (SHARED BY WEBGL & 2D FALLBACK)
             * ========================================================================== */
            function generateOrbitalDataset(maxCount) {
                var data = {
                    swarmRadiusRatio: new Float32Array(maxCount),
                    swarmCosInc: new Float32Array(maxCount),
                    swarmSinInc: new Float32Array(maxCount),
                    swarmCosNode: new Float32Array(maxCount),
                    swarmSinNode: new Float32Array(maxCount),
                    swarmPhase: new Float32Array(maxCount),
                    swarmSpeed: new Float32Array(maxCount),
                    swarmScale: new Float32Array(maxCount),
                    swarmIsNode: new Uint8Array(maxCount),

                    shellTheta: new Float32Array(maxCount),
                    shellSinPhi: new Float32Array(maxCount),
                    shellCosPhi: new Float32Array(maxCount),
                    shellRadiusOffset: new Float32Array(maxCount),
                    shellScale: new Float32Array(maxCount)
                };

                var bandCount = 16;
                var bandInclinations = new Float32Array(bandCount);
                var bandNodes = new Float32Array(bandCount);
                var bandRadii = new Float32Array(bandCount);

                for (var b = 0; b < bandCount; b++) {
                    var t = b / bandCount;
                    bandInclinations[b] = (t - 0.5) * Math.PI * 0.86 + Math.sin(b * 2.1) * 0.12;
                    bandNodes[b] = (b * Math.PI * 2.0) / bandCount + 0.35;
                    bandRadii[b] = 0.84 + (b % 5) * 0.075 + Math.cos(b * 1.7) * 0.03;
                }

                var goldenAngle = Math.PI * (3.0 - Math.sqrt(5.0));

                for (var i = 0; i < maxCount; i++) {
                    var inStream = (i % 9) !== 0;
                    var band = i % bandCount;
                    var inc, node;

                    if (inStream) {
                        var streamSpread = ((i * 73) % 100) / 100.0 - 0.5;
                        data.swarmRadiusRatio[i] = bandRadii[band] + streamSpread * 0.055;
                        inc = bandInclinations[band] + streamSpread * 0.045;
                        node = bandNodes[band] + streamSpread * 0.04;
                    } else {
                        var u = ((i * 37) % 1000) / 1000.0;
                        data.swarmRadiusRatio[i] = 0.88 + ((i * 19) % 100) / 360.0;
                        inc = (u - 0.5) * Math.PI * 0.92;
                        node = i * goldenAngle;
                    }

                    // Precompute trig values so the per-frame loop avoids Math.sin/cos on static angles
                    data.swarmCosInc[i] = Math.cos(inc);
                    data.swarmSinInc[i] = Math.sin(inc);
                    data.swarmCosNode[i] = Math.cos(node);
                    data.swarmSinNode[i] = Math.sin(node);

                    data.swarmPhase[i] = (i * goldenAngle) % (Math.PI * 2.0);
                    var rRatio = data.swarmRadiusRatio[i];
                    var dir = (band % 4 === 3) ? -1.0 : 1.0;
                    data.swarmSpeed[i] = dir * (0.14 / Math.pow(rRatio, 1.5)) * (0.9 + ((i * 13) % 20) * 0.01);

                    var isMajorNode = (i % 26 === 0);
                    data.swarmIsNode[i] = isMajorNode ? 1 : 0;
                    data.swarmScale[i] = isMajorNode
                        ? 1.65
                        : (0.72 + ((i * 29) % 100) / 160.0);

                    // Shell lattice
                    var permutedIdx = (i * 499) % maxCount;
                    var yNorm = 1.0 - (permutedIdx / (maxCount - 1)) * 2.0;
                    if (Math.abs(yNorm) > 0.94) {
                        yNorm = yNorm > 0 ? 0.94 : -0.94;
                    } else if (Math.abs(yNorm) < 0.028) {
                        yNorm = yNorm >= 0 ? 0.028 : -0.028;
                    }

                    var phi = Math.acos(Math.max(-1.0, Math.min(1.0, yNorm)));
                    data.shellSinPhi[i] = Math.sin(phi);
                    data.shellCosPhi[i] = Math.cos(phi);
                    data.shellTheta[i] = permutedIdx * goldenAngle;

                    var shellLayer = (i % 7 === 0) ? 1.035 : ((i % 2 === 0) ? 1.0 : 0.982);
                    data.shellRadiusOffset[i] = shellLayer;
                    data.shellScale[i] = (i % 7 === 0) ? 1.45 : 1.25;
                }

                data.bandCount = bandCount;
                data.bandInclinations = bandInclinations;
                data.bandNodes = bandNodes;
                data.bandRadii = bandRadii;
                return data;
            }

            // Preallocate for maximum desktop ceiling (3600) once
            var MAX_POOL_SIZE = 3600;
            var orbitalData = generateOrbitalDataset(MAX_POOL_SIZE);

            /* ==========================================================================
             * 5. OPTIMIZED THREE.JS WEBGL SCENE BUILDER (5-6 TOTAL DRAW CALLS)
             * ========================================================================== */
            function createWebGLScene(canvas) {
                if (typeof THREE === 'undefined') {
                    return null;
                }

                var renderer;
                try {
                    renderer = new THREE.WebGLRenderer({
                        canvas: canvas,
                        // Disable MSAA on mobile devices to save tile-buffer bandwidth
                        antialias: !profile.isMobile,
                        powerPreference: 'high-performance',
                        alpha: false,
                        stencil: false
                    });
                } catch (err) {
                    return null;
                }

                renderer.setPixelRatio(appState.pixelRatio || profile.pixelRatio);
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setClearColor(0x03050a, 1);

                var scene = new THREE.Scene();
                var camera = new THREE.PerspectiveCamera(
                    46,
                    window.innerWidth / Math.max(1, window.innerHeight),
                    0.1,
                    260
                );

                var backgroundGroup = new THREE.Group();
                var systemGroup = new THREE.Group();
                scene.add(backgroundGroup);
                scene.add(systemGroup);

                /* ------------------------------------------------------------------------
                 * 5A. VERTEX-SHADED DEEP SPACE NEBULA DOME (ZERO PER-PIXEL NOISE LOOPS)
                 * ------------------------------------------------------------------------ */
                var nebulaGeo = new THREE.SphereGeometry(120, 24, 16);
                var nebulaMat = new THREE.ShaderMaterial({
                    side: THREE.BackSide,
                    depthWrite: false,
                    precision: 'mediump',
                    vertexShader: [
                        'varying vec3 vNebulaColor;',
                        'void main() {',
                        '  vec3 dir = normalize(position);',
                        '  float galacticBand = exp(-abs(dir.y + 0.16 * sin(dir.x * 2.4)) * 3.0);',
                        '  float waveA = 0.5 + 0.5 * sin(dir.x * 3.2 + dir.z * 2.1);',
                        '  float waveB = 0.5 + 0.5 * cos(dir.z * 4.1 - dir.y * 2.7);',
                        '  vec3 baseSpace = vec3(0.012, 0.020, 0.042);',
                        '  vec3 indigoNebula = vec3(0.08, 0.13, 0.30) * waveA * (0.4 + 0.6 * galacticBand);',
                        '  vec3 violetNebula = vec3(0.19, 0.09, 0.32) * waveB * galacticBand;',
                        '  vec3 cyanWisp = vec3(0.04, 0.20, 0.34) * (waveA * waveB) * galacticBand;',
                        '  vNebulaColor = baseSpace + indigoNebula * 0.55 + violetNebula * 0.45 + cyanWisp * 0.4;',
                        '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
                        '}'
                    ].join('\n'),
                    fragmentShader: [
                        'precision mediump float;',
                        'varying vec3 vNebulaColor;',
                        'void main() {',
                        '  gl_FragColor = vec4(vNebulaColor, 1.0);',
                        '}'
                    ].join('\n')
                });
                var nebulaMesh = new THREE.Mesh(nebulaGeo, nebulaMat);
                backgroundGroup.add(nebulaMesh);

                // Procedural Starfield Points (Reduced particle count for mobile)
                var starCount = profile.starCount;
                var starPositions = new Float32Array(starCount * 3);
                var starColors = new Float32Array(starCount * 3);
                var starSizes = new Float32Array(starCount);

                for (var s = 0; s < starCount; s++) {
                    var u = Math.random();
                    var v = Math.random();
                    var theta = u * 2.0 * Math.PI;
                    var phi = Math.acos(2.0 * v - 1.0);
                    var rad = 65.0 + Math.random() * 45.0;

                    starPositions[s * 3] = rad * Math.sin(phi) * Math.cos(theta);
                    starPositions[s * 3 + 1] = rad * Math.cos(phi);
                    starPositions[s * 3 + 2] = rad * Math.sin(phi) * Math.sin(theta);

                    var tint = Math.random();
                    if (tint < 0.55) {
                        starColors[s * 3] = 0.82;
                        starColors[s * 3 + 1] = 0.90;
                        starColors[s * 3 + 2] = 1.0;
                    } else if (tint < 0.85) {
                        starColors[s * 3] = 0.98;
                        starColors[s * 3 + 1] = 0.96;
                        starColors[s * 3 + 2] = 0.92;
                    } else {
                        starColors[s * 3] = 1.0;
                        starColors[s * 3 + 1] = 0.82;
                        starColors[s * 3 + 2] = 0.58;
                    }

                    var isBright = Math.random() < 0.07;
                    starSizes[s] = isBright ? (2.2 + Math.random() * 1.5) : (0.85 + Math.random() * 1.15);
                }

                var starsGeo = new THREE.BufferGeometry();
                starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
                starsGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
                starsGeo.setAttribute('aSize', new THREE.BufferAttribute(starSizes, 1));

                var starsMat = new THREE.ShaderMaterial({
                    transparent: true,
                    depthWrite: false,
                    blending: THREE.AdditiveBlending,
                    vertexColors: true,
                    precision: 'mediump',
                    uniforms: {
                        uPixelRatio: { value: appState.pixelRatio || profile.pixelRatio },
                        uTime: { value: 0 }
                    },
                    vertexShader: [
                        'attribute float aSize;',
                        'varying vec3 vColor;',
                        'uniform float uPixelRatio;',
                        'uniform float uTime;',
                        'void main() {',
                        '  float seed = position.x * 0.13 + position.y * 0.27;',
                        '  float twinkle = 0.84 + 0.16 * sin(uTime * 1.3 + seed * 10.0);',
                        '  vColor = color * twinkle;',
                        '  vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);',
                        '  gl_PointSize = aSize * uPixelRatio * (110.0 / -mvPosition.z);',
                        '  gl_Position = projectionMatrix * mvPosition;',
                        '}'
                    ].join('\n'),
                    fragmentShader: [
                        'precision mediump float;',
                        'varying vec3 vColor;',
                        'void main() {',
                        '  vec2 uv = gl_PointCoord - vec2(0.5);',
                        '  float d2 = dot(uv, uv);',
                        '  if (d2 > 0.25) discard;',
                        '  float alpha = (0.25 - d2) * 3.6;',
                        '  gl_FragColor = vec4(vColor, alpha);',
                        '}'
                    ].join('\n')
                });

                var starFieldPoints = new THREE.Points(starsGeo, starsMat);
                backgroundGroup.add(starFieldPoints);

                /* ------------------------------------------------------------------------
                 * 5B. LIGHTWEIGHT CENTRAL STAR + SINGLE UNIFIED CORONA SHELL (2 DRAW CALLS)
                 * ------------------------------------------------------------------------ */
                var starGroup = new THREE.Group();
                systemGroup.add(starGroup);

                var starRadius = 1.95;
                var starGeo = new THREE.SphereGeometry(starRadius, 32, 32);
                var starMat = new THREE.ShaderMaterial({
                    precision: 'mediump',
                    uniforms: {
                        uTime: { value: 0 },
                        uIntensity: { value: appState.starIntensity }
                    },
                    vertexShader: [
                        'varying vec3 vNormal;',
                        'varying vec3 vPosition;',
                        'varying vec3 vViewPosition;',
                        'void main() {',
                        '  vNormal = normalize(normalMatrix * normal);',
                        '  vPosition = normalize(position);',
                        '  vec4 mvPos = modelViewMatrix * vec4(position, 1.0);',
                        '  vViewPosition = -mvPos.xyz;',
                        '  gl_Position = projectionMatrix * mvPos;',
                        '}'
                    ].join('\n'),
                    fragmentShader: [
                        'precision mediump float;',
                        'varying vec3 vNormal;',
                        'varying vec3 vPosition;',
                        'varying vec3 vViewPosition;',
                        'uniform float uTime;',
                        'uniform float uIntensity;',
                        'void main() {',
                        '  vec3 viewDir = normalize(vViewPosition);',
                        '  float mu = clamp(dot(normalize(vNormal), viewDir), 0.0, 1.0);',
                        '  vec3 p = vPosition * 7.0;',
                        '  float t = uTime * 0.22;',
                        '  float g1 = sin(p.x * 2.2 + t) * cos(p.y * 2.4 - t) * sin(p.z * 2.1 + t * 0.7);',
                        '  float g2 = cos(p.x * 4.5 - t * 1.2) * sin(p.y * 4.2 + p.z * 4.3);',
                        '  float granules = 0.5 + 0.32 * g1 + 0.18 * g2;',
                        '  vec3 coreWhite = vec3(1.0, 0.99, 0.94);',
                        '  vec3 warmGold = vec3(1.0, 0.80, 0.42);',
                        '  vec3 limbAmber = vec3(0.92, 0.46, 0.12);',
                        '  vec3 baseCol = mix(limbAmber, warmGold, sqrt(mu));',
                        '  baseCol = mix(baseCol, coreWhite, mu * mu * (0.68 + 0.32 * granules));',
                        '  float brightness = 0.72 + 0.32 * sqrt(uIntensity);',
                        '  gl_FragColor = vec4(clamp(baseCol * brightness, 0.0, 1.0), 1.0);',
                        '}'
                    ].join('\n')
                });

                var starMesh = new THREE.Mesh(starGeo, starMat);
                starGroup.add(starMesh);

                // Single Consolidated Dual-Falloff Atmospheric Corona (Replaces 2 corona spheres + 5 arc meshes)
                var coronaGeo = new THREE.SphereGeometry(starRadius * 2.05, 28, 28);
                var coronaMat = new THREE.ShaderMaterial({
                    transparent: true,
                    depthWrite: false,
                    side: THREE.BackSide,
                    blending: THREE.AdditiveBlending,
                    precision: 'mediump',
                    uniforms: {
                        uIntensity: { value: appState.starIntensity },
                        uTime: { value: 0 }
                    },
                    vertexShader: [
                        'varying vec3 vNormal;',
                        'varying vec3 vViewDir;',
                        'void main() {',
                        '  vNormal = normalize(normalMatrix * normal);',
                        '  vec4 mvPos = modelViewMatrix * vec4(position, 1.0);',
                        '  vViewDir = normalize(-mvPos.xyz);',
                        '  gl_Position = projectionMatrix * mvPos;',
                        '}'
                    ].join('\n'),
                    fragmentShader: [
                        'precision mediump float;',
                        'varying vec3 vNormal;',
                        'varying vec3 vViewDir;',
                        'uniform float uIntensity;',
                        'uniform float uTime;',
                        'void main() {',
                        '  float d = clamp(dot(-vNormal, vViewDir), 0.0, 1.0);',
                        '  float d2 = d * d;',
                        '  float innerGlow = d2 * d * 0.56;',
                        '  float outerGlow = d2 * d2 * 0.30;',
                        '  float pulse = 0.96 + 0.04 * sin(uTime * 1.3);',
                        '  vec3 col = mix(vec3(0.95, 0.48, 0.14), vec3(1.0, 0.90, 0.64), d2);',
                        '  float scale = clamp(0.55 + 0.45 * uIntensity, 0.4, 1.45);',
                        '  float alpha = (innerGlow + outerGlow) * pulse * scale;',
                        '  gl_FragColor = vec4(col, alpha);',
                        '}'
                    ].join('\n')
                });
                var starCorona = new THREE.Mesh(coronaGeo, coronaMat);
                starGroup.add(starCorona);

                /* ------------------------------------------------------------------------
                 * 5C. DYSON COLLECTORS (6-TRIANGLE HEXAGONAL INSTANCED MESH)
                 * ------------------------------------------------------------------------ */
                // Flat 6-segment hexagonal disc (6 triangles instead of 24 on a capped cylinder)
                var collectorGeo = new THREE.CircleGeometry(0.14, 6);

                var collectorMat = new THREE.ShaderMaterial({
                    side: THREE.DoubleSide,
                    precision: 'mediump',
                    uniforms: {
                        uStarIntensity: { value: appState.starIntensity },
                        uTime: { value: 0 }
                    },
                    vertexShader: [
                        'attribute float aPhase;',
                        'attribute float aNodeFlag;',
                        'varying vec3 vWorldPos;',
                        'varying vec3 vWorldNormal;',
                        'varying float vPhase;',
                        'varying float vNodeFlag;',
                        'void main() {',
                        '  vPhase = aPhase;',
                        '  vNodeFlag = aNodeFlag;',
                        '  vec4 worldPosition = modelMatrix * instanceMatrix * vec4(position, 1.0);',
                        '  vWorldPos = worldPosition.xyz;',
                        '  vWorldNormal = normalize(mat3(modelMatrix * instanceMatrix) * normal);',
                        '  gl_Position = projectionMatrix * viewMatrix * worldPosition;',
                        '}'
                    ].join('\n'),
                    fragmentShader: [
                        'precision mediump float;',
                        'varying vec3 vWorldPos;',
                        'varying vec3 vWorldNormal;',
                        'varying float vPhase;',
                        'varying float vNodeFlag;',
                        'uniform float uStarIntensity;',
                        'uniform float uTime;',
                        'void main() {',
                        '  vec3 N = normalize(vWorldNormal);',
                        '  vec3 toStar = normalize(-vWorldPos);',
                        '  vec3 toCam = normalize(cameraPosition - vWorldPos);',
                        '  float ndotl = abs(dot(N, toStar));',
                        '  vec3 H = normalize(toStar + toCam);',
                        '  float ndoth = max(0.0, abs(dot(N, H)));',
                        '  float ndoth2 = ndoth * ndoth;',
                        '  float spec = MathSpec;',
                        '  float rim = 1.0 - max(0.0, abs(dot(N, toCam)));',
                        '  rim = rim * rim;',
                        '  float glint = 0.85 + 0.15 * sin(uTime * 1.8 + vPhase * 6.2831);',
                        '  vec3 coolShadow = vec3(0.06, 0.13, 0.25);',
                        '  vec3 warmLit = vec3(0.96, 0.76, 0.42);',
                        '  vec3 cyanEdge = vec3(0.18, 0.72, 0.96);',
                        '  vec3 goldSpec = vec3(1.0, 0.92, 0.68);',
                        '  float intensityScale = clamp(0.55 + 0.45 * uStarIntensity, 0.4, 1.6);',
                        '  vec3 col = mix(coolShadow, warmLit, ndotl * 0.78 * intensityScale);',
                        '  col += goldSpec * spec * 0.95 * glint * intensityScale;',
                        '  col += cyanEdge * rim * 0.26;',
                        '  col += vec3(0.95, 0.62, 0.15) * (0.28 * glint * vNodeFlag);',
                        '  gl_FragColor = vec4(col, 1.0);',
                        '}'
                    ].join('\n').replace('MathSpec', 'ndoth2 * ndoth2 * ndoth2 * ndoth2 * ndoth2 * ndoth2')
                });

                var instancedCollectors = new THREE.InstancedMesh(
                    collectorGeo,
                    collectorMat,
                    MAX_POOL_SIZE
                );
                instancedCollectors.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

                var phaseAttr = new THREE.InstancedBufferAttribute(orbitalData.swarmPhase, 1);
                var nodeFlagAttr = new THREE.InstancedBufferAttribute(
                    new Float32Array(orbitalData.swarmIsNode),
                    1
                );
                collectorGeo.setAttribute('aPhase', phaseAttr);
                collectorGeo.setAttribute('aNodeFlag', nodeFlagAttr);

                systemGroup.add(instancedCollectors);

                /* ------------------------------------------------------------------------
                 * 5D. ORBITAL GUIDE LINES (1 DRAW CALL)
                 * ------------------------------------------------------------------------ */
                var orbitLinesGroup = new THREE.Group();
                systemGroup.add(orbitLinesGroup);

                var segmentsPerRing = 72;
                var ringPositions = [];
                for (var b = 0; b < orbitalData.bandCount; b++) {
                    var inc = orbitalData.bandInclinations[b];
                    var node = orbitalData.bandNodes[b];
                    var rRatio = orbitalData.bandRadii[b];

                    var cosNode = Math.cos(node);
                    var sinNode = Math.sin(node);
                    var cosInc = Math.cos(inc);
                    var sinInc = Math.sin(inc);

                    for (var sIdx = 0; sIdx < segmentsPerRing; sIdx++) {
                        var a1 = (sIdx / segmentsPerRing) * Math.PI * 2.0;
                        var a2 = ((sIdx + 1) / segmentsPerRing) * Math.PI * 2.0;

                        var x1 = rRatio * Math.cos(a1);
                        var z1 = rRatio * Math.sin(a1);
                        var x2 = rRatio * Math.cos(a2);
                        var z2 = rRatio * Math.sin(a2);

                        var y1 = -z1 * sinInc;
                        var z1Inc = z1 * cosInc;
                        var wx1 = x1 * cosNode + z1Inc * sinNode;
                        var wz1 = -x1 * sinNode + z1Inc * cosNode;

                        var y2 = -z2 * sinInc;
                        var z2Inc = z2 * cosInc;
                        var wx2 = x2 * cosNode + z2Inc * sinNode;
                        var wz2 = -x2 * sinNode + z2Inc * cosNode;

                        ringPositions.push(wx1, y1, wz1, wx2, y2, wz2);
                    }
                }

                var orbitLinesGeo = new THREE.BufferGeometry();
                orbitLinesGeo.setAttribute(
                    'position',
                    new THREE.Float32BufferAttribute(ringPositions, 3)
                );
                var orbitLinesMat = new THREE.LineBasicMaterial({
                    color: 0x3ce6ff,
                    transparent: true,
                    opacity: 0.16,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });
                var orbitLinesMesh = new THREE.LineSegments(orbitLinesGeo, orbitLinesMat);
                orbitLinesGroup.add(orbitLinesMesh);

                /* ------------------------------------------------------------------------
                 * 5E. FAST INLINE MATRIX BUFFER UPDATER WITH DIRTY-FLAG SKIPPING
                 * ------------------------------------------------------------------------ */
                var elapsedOrbitalTime = 0;
                var modeBlend = 0;

                function updateCollectorsTransform(dt) {
                    var motionActive = !appState.paused && appState.collectorMotion;
                    if (motionActive) {
                        elapsedOrbitalTime += dt * appState.timeScale;
                    }

                    var targetBlend = appState.mode === 'shell' ? 1.0 : 0.0;
                    var isMorphing = Math.abs(targetBlend - modeBlend) > 0.001;
                    if (isMorphing) {
                        var blendStep = 1.0 - Math.exp(-6.5 * dt);
                        modeBlend += (targetBlend - modeBlend) * blendStep;
                        if (Math.abs(targetBlend - modeBlend) <= 0.001) {
                            modeBlend = targetBlend;
                            isMorphing = false;
                        }
                    }

                    var count = appState.collectorCount;
                    instancedCollectors.count = count;
                    var baseRadius = appState.orbitalRadius * BASE_ORBIT_SCENE_UNITS;

                    // Update orbital guide lines visibility & scale
                    orbitLinesGroup.visible = appState.showOrbitalPaths;
                    var orbitLineScale = baseRadius * (1.0 - 0.12 * modeBlend);
                    orbitLinesMesh.scale.set(orbitLineScale, orbitLineScale, orbitLineScale);
                    orbitLinesMat.opacity = appState.mode === 'shell' ? 0.09 : 0.16;

                    // Skip CPU matrix loop and GPU buffer upload if collectors are stationary
                    if (!motionActive && !isMorphing && !appState.collectorsDirty) {
                        return false;
                    }
                    appState.collectorsDirty = false;

                    var matArray = instancedCollectors.instanceMatrix.array;
                    var invBlend = 1.0 - modeBlend;
                    var shellTimeOffset = elapsedOrbitalTime * 0.045;

                    for (var i = 0; i < count; i++) {
                        var px, py, pz;

                        if (modeBlend < 0.999) {
                            var phase = orbitalData.swarmPhase[i] + elapsedOrbitalTime * orbitalData.swarmSpeed[i];
                            var rSwarm = baseRadius * orbitalData.swarmRadiusRatio[i];
                            var lx = rSwarm * Math.cos(phase);
                            var lz = rSwarm * Math.sin(phase);
                            var ly = -lz * orbitalData.swarmSinInc[i];
                            var lzInc = lz * orbitalData.swarmCosInc[i];

                            var sx = lx * orbitalData.swarmCosNode[i] + lzInc * orbitalData.swarmSinNode[i];
                            var sy = ly;
                            var sz = -lx * orbitalData.swarmSinNode[i] + lzInc * orbitalData.swarmCosNode[i];
                            px = sx; py = sy; pz = sz;
                        } else {
                            px = 0; py = 0; pz = 0;
                        }

                        if (modeBlend > 0.001) {
                            var sinPhi = orbitalData.shellSinPhi[i];
                            var cosPhi = orbitalData.shellCosPhi[i];
                            var sTheta = orbitalData.shellTheta[i] + shellTimeOffset;
                            var rShell = baseRadius * 0.88 * orbitalData.shellRadiusOffset[i];

                            var shx = rShell * sinPhi * Math.cos(sTheta);
                            var shy = rShell * cosPhi;
                            var shz = rShell * sinPhi * Math.sin(sTheta);

                            px = px * invBlend + shx * modeBlend;
                            py = py * invBlend + shy * modeBlend;
                            pz = pz * invBlend + shz * modeBlend;
                        }

                        var scaleVal = orbitalData.swarmScale[i] * invBlend +
                            orbitalData.shellScale[i] * 1.48 * modeBlend;

                        // Construct orthonormal lookAt(0,0,0) basis directly in instanceMatrix buffer
                        var invLen = 1.0 / (Math.hypot(px, py, pz) || 1.0);
                        var zx = -px * invLen;
                        var zy = -py * invLen;
                        var zz = -pz * invLen;

                        var xx = zz;
                        var xz = -zx;
                        var xLen = Math.hypot(xx, xz);
                        if (xLen < 0.0001) {
                            xx = 1.0; xz = 0.0;
                        } else {
                            var invX = 1.0 / xLen;
                            xx *= invX; xz *= invX;
                        }

                        var yx = zy * xz;
                        var yy = zz * xx - zx * xz;
                        var yz = -zy * xx;

                        var offset = i * 16;
                        matArray[offset] = xx * scaleVal;
                        matArray[offset + 1] = 0.0;
                        matArray[offset + 2] = xz * scaleVal;
                        matArray[offset + 3] = 0.0;

                        matArray[offset + 4] = yx * scaleVal;
                        matArray[offset + 5] = yy * scaleVal;
                        matArray[offset + 6] = yz * scaleVal;
                        matArray[offset + 7] = 0.0;

                        matArray[offset + 8] = zx * scaleVal;
                        matArray[offset + 9] = zy * scaleVal;
                        matArray[offset + 10] = zz * scaleVal;
                        matArray[offset + 11] = 0.0;

                        matArray[offset + 12] = px;
                        matArray[offset + 13] = py;
                        matArray[offset + 14] = pz;
                        matArray[offset + 15] = 1.0;
                    }

                    instancedCollectors.instanceMatrix.needsUpdate = true;
                    return isMorphing;
                }

                updateCollectorsTransform(0.016);

                var totalShaderTime = 0;

                return {
                    type: 'webgl',
                    renderer: renderer,
                    updateAndRender: function (dt, camPos) {
                        if (!appState.paused) {
                            totalShaderTime += dt;
                        }

                        starMat.uniforms.uTime.value = totalShaderTime;
                        starMat.uniforms.uIntensity.value = appState.starIntensity;
                        coronaMat.uniforms.uTime.value = totalShaderTime;
                        coronaMat.uniforms.uIntensity.value = appState.starIntensity;
                        collectorMat.uniforms.uTime.value = totalShaderTime;
                        collectorMat.uniforms.uStarIntensity.value = appState.starIntensity;
                        starsMat.uniforms.uTime.value = totalShaderTime;

                        var isMorphing = updateCollectorsTransform(dt);

                        camera.position.set(camPos.x, camPos.y, camPos.z);
                        camera.lookAt(0, 0, 0);

                        renderer.render(scene, camera);
                        return isMorphing;
                    },
                    resize: function (w, h) {
                        profile = detectPerformanceProfile();
                        var pr = appState.pixelRatio || profile.pixelRatio;
                        renderer.setPixelRatio(pr);
                        renderer.setSize(w, h);
                        starsMat.uniforms.uPixelRatio.value = pr;
                        camera.aspect = w / Math.max(1, h);
                        camera.updateProjectionMatrix();
                    },
                    dispose: function () {
                        nebulaGeo.dispose();
                        nebulaMat.dispose();
                        starsGeo.dispose();
                        starsMat.dispose();
                        starGeo.dispose();
                        starMat.dispose();
                        coronaGeo.dispose();
                        coronaMat.dispose();
                        collectorGeo.dispose();
                        collectorMat.dispose();
                        orbitLinesGeo.dispose();
                        orbitLinesMat.dispose();
                        renderer.dispose();
                    }
                };
            }

            /* ==========================================================================
             * 6. GRACEFUL CANVAS 2D FALLBACK RENDERER
             * ========================================================================== */
            function createCanvas2DFallback(canvas) {
                var ctx = canvas.getContext('2d');
                var noticeEl = document.getElementById('renderer-notice');
                if (noticeEl) {
                    noticeEl.style.display = 'block';
                }

                var elapsed = 0;
                var bgStars = [];
                for (var i = 0; i < 220; i++) {
                    bgStars.push({
                        x: Math.random(),
                        y: Math.random(),
                        r: 0.6 + Math.random() * 1.3,
                        a: 0.25 + Math.random() * 0.65
                    });
                }

                function resize(w, h) {
                    var dpr = 1.0;
                    canvas.width = w * dpr;
                    canvas.height = h * dpr;
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                }

                resize(window.innerWidth, window.innerHeight);

                return {
                    type: 'canvas2d',
                    updateAndRender: function (dt, camPos) {
                        if (!appState.paused && appState.collectorMotion) {
                            elapsed += dt;
                        }

                        var w = window.innerWidth;
                        var h = window.innerHeight;
                        var cx = w * 0.5;
                        var cy = h * 0.5;

                        ctx.fillStyle = '#03060e';
                        ctx.fillRect(0, 0, w, h);

                        ctx.fillStyle = '#d8e8ff';
                        for (var s = 0; s < bgStars.length; s++) {
                            var st = bgStars[s];
                            ctx.globalAlpha = st.a;
                            ctx.beginPath();
                            ctx.arc(st.x * w, st.y * h, st.r, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        ctx.globalAlpha = 1.0;

                        var camDist = Math.hypot(camPos.x, camPos.y, camPos.z);
                        var scale = Math.min(w, h) * (0.95 / Math.max(4.0, camDist));

                        var fzX = -camPos.x / camDist;
                        var fzY = -camPos.y / camDist;
                        var fzZ = -camPos.z / camDist;
                        var rx = fzZ;
                        var ry = 0;
                        var rz = -fzX;
                        var rLen = Math.hypot(rx, rz) || 1;
                        rx /= rLen; rz /= rLen;
                        var ux = fzY * rz;
                        var uy = fzZ * rx - fzX * rz;
                        var uz = -fzY * rx;

                        var count = Math.min(appState.collectorCount, 800);
                        var baseRadius = appState.orbitalRadius * BASE_ORBIT_SCENE_UNITS;
                        var projected = [];

                        for (var i = 0; i < count; i++) {
                            var wx, wy, wz;
                            if (appState.mode === 'swarm') {
                                var phase = orbitalData.swarmPhase[i] + elapsed * orbitalData.swarmSpeed[i];
                                var rSwarm = baseRadius * orbitalData.swarmRadiusRatio[i];
                                var lx = rSwarm * Math.cos(phase);
                                var lz = rSwarm * Math.sin(phase);
                                var ly = -lz * orbitalData.swarmSinInc[i];
                                var lzInc = lz * orbitalData.swarmCosInc[i];
                                wx = lx * orbitalData.swarmCosNode[i] + lzInc * orbitalData.swarmSinNode[i];
                                wy = ly;
                                wz = -lx * orbitalData.swarmSinNode[i] + lzInc * orbitalData.swarmCosNode[i];
                            } else {
                                var sinPhi = orbitalData.shellSinPhi[i];
                                var cosPhi = orbitalData.shellCosPhi[i];
                                var theta = orbitalData.shellTheta[i] + elapsed * 0.045;
                                var rShell = baseRadius * 0.88;
                                wx = rShell * sinPhi * Math.cos(theta);
                                wy = rShell * cosPhi;
                                wz = rShell * sinPhi * Math.sin(theta);
                            }

                            var px = wx * rx + wy * ry + wz * rz;
                            var py = wx * ux + wy * uy + wz * uz;
                            var pz = wx * fzX + wy * fzY + wz * fzZ;

                            projected.push({ x: cx + px * scale, y: cy - py * scale, z: pz });
                        }

                        projected.sort(function (a, b) { return b.z - a.z; });

                        for (var j = 0; j < projected.length; j++) {
                            var pt = projected[j];
                            if (pt.z < 0) continue;
                            ctx.fillStyle = '#2b5f8c';
                            ctx.fillRect(pt.x - 1.5, pt.y - 1.5, 3, 3);
                        }

                        var starScreenR = Math.max(14, 1.95 * scale);
                        var grad = ctx.createRadialGradient(cx, cy, starScreenR * 0.1, cx, cy, starScreenR * 2.4);
                        grad.addColorStop(0, '#fffdf2');
                        grad.addColorStop(0.35, '#ffd269');
                        grad.addColorStop(0.7, 'rgba(245, 140, 35, 0.28)');
                        grad.addColorStop(1, 'rgba(245, 140, 35, 0)');
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(cx, cy, starScreenR * 2.4, 0, Math.PI * 2);
                        ctx.fill();

                        for (var k = 0; k < projected.length; k++) {
                            var fpt = projected[k];
                            if (fpt.z >= 0) continue;
                            ctx.fillStyle = '#ffd478';
                            ctx.fillRect(fpt.x - 2, fpt.y - 2, 3.8, 3.8);
                        }

                        return false;
                    },
                    resize: resize,
                    dispose: function () { }
                };
            }

            /* ==========================================================================
             * 7. INITIALIZE SCENE, UI BINDINGS & DEMAND-DRIVEN FRAME SCHEDULER
             * ========================================================================== */
            var canvas = document.getElementById('scene-canvas');
            var rafId = null;
            var timerId = null;   // pacing timer used by the FPS cap
            var lastFrameTime = performance.now();

            function scheduleLoop() {
                if (rafId === null && timerId === null && !appState.tabHidden) {
                    lastFrameTime = performance.now();
                    rafId = requestAnimationFrame(animate);
                }
            }

            function requestSceneRender(markCollectorsDirty) {
                appState.needsRender = true;
                if (markCollectorsDirty) {
                    appState.collectorsDirty = true;
                }
                scheduleLoop();
            }

            var cameraCtrl = createCameraController(canvas, function () {
                requestSceneRender(false);
            });

            var activeRenderer = createWebGLScene(canvas);
            if (!activeRenderer) {
                activeRenderer = createCanvas2DFallback(canvas);
            }

            canvas.addEventListener('webglcontextlost', function (event) {
                event.preventDefault();
                if (activeRenderer && activeRenderer.dispose) {
                    activeRenderer.dispose();
                }
                activeRenderer = createCanvas2DFallback(canvas);
                requestSceneRender(true);
            });

            canvas.addEventListener('webglcontextrestored', function () {
                var noticeEl = document.getElementById('renderer-notice');
                if (noticeEl) noticeEl.style.display = 'none';
                var restored = createWebGLScene(canvas);
                if (restored) {
                    activeRenderer = restored;
                    requestSceneRender(true);
                }
            });


            /* ==========================================================================
             * 7B. WALLPAPER ENGINE BRIDGE (properties, suspend, FPS cap)
             * ========================================================================== */
            var vignetteEl = document.getElementById('vignette');
            var weSuspended = false;   // set by Wallpaper Engine when another app covers the desktop
            var fpsCap = 60;           // 0 = uncapped (follows display refresh)

            function syncSuspend() {
                appState.tabHidden = Boolean(document.hidden) || weSuspended;
                if (appState.tabHidden) {
                    if (rafId !== null) {
                        cancelAnimationFrame(rafId);
                        rafId = null;
                    }
                    if (timerId !== null) {
                        clearTimeout(timerId);
                        timerId = null;
                    }
                } else {
                    lastFrameTime = performance.now();
                    requestSceneRender(false);
                }
            }

            document.addEventListener('visibilitychange', syncSuspend);

            window.addEventListener('resize', function () {
                if (activeRenderer && activeRenderer.resize) {
                    activeRenderer.resize(window.innerWidth, window.innerHeight);
                }
                requestSceneRender(true);
            });

            window.addEventListener('dblclick', function () {
                if (cameraCtrl.enabled) cameraCtrl.reset();
            });

            /* --------------------------------------------------------------------------
             * Input debug overlay: shows which events actually reach the page, to diagnose
             * Wallpaper Engine mouse forwarding. Enable via the "Show input debug" property
             * or by adding ?debug to the URL.
             * -------------------------------------------------------------------------- */
            var debugEl = document.getElementById('input-debug');
            var debugCounts = {};
            var debugLast = '-';
            var debugTimer = null;
            var DEBUG_EVENTS = ['pointerdown', 'pointermove', 'pointerup', 'mousedown', 'mousemove',
                'mouseup', 'click', 'dblclick', 'contextmenu', 'wheel', 'keydown', 'focus', 'blur'];

            DEBUG_EVENTS.forEach(function (type) {
                debugCounts[type] = 0;
                window.addEventListener(type, function (e) {
                    debugCounts[type]++;
                    if (type !== 'pointermove' && type !== 'mousemove') {
                        debugLast = type + ' @ ' + Math.round(e.clientX || 0) + ',' + Math.round(e.clientY || 0) +
                            ' btn=' + (e.buttons === undefined ? '-' : e.buttons) +
                            ' target=' + (e.target && e.target.id ? '#' + e.target.id : (e.target && e.target.nodeName));
                    }
                }, true);
            });

            function renderDebug() {
                var lines = ['INPUT DEBUG  (' + window.innerWidth + 'x' + window.innerHeight + ', dpr ' +
                    (window.devicePixelRatio || 1) + ')'];
                for (var i = 0; i < DEBUG_EVENTS.length; i += 3) {
                    lines.push(DEBUG_EVENTS.slice(i, i + 3).map(function (t) {
                        return (t + '          ').slice(0, 12) + String(debugCounts[t]).padStart(5);
                    }).join('  '));
                }
                lines.push('dragging: ' + cameraCtrl.isDragging + '   enabled: ' + cameraCtrl.enabled);
                lines.push('last: ' + debugLast);
                debugEl.textContent = lines.join('\n');
            }

            function setDebug(on) {
                debugEl.style.display = on ? 'block' : 'none';
                if (on && debugTimer === null) {
                    renderDebug();
                    debugTimer = setInterval(renderDebug, 200);
                } else if (!on && debugTimer !== null) {
                    clearInterval(debugTimer);
                    debugTimer = null;
                }
            }

            if (/[?&]debug\b/.test(window.location.search)) setDebug(true);

            function num(v, fallback) {
                var n = parseFloat(v);
                return isFinite(n) ? n : fallback;
            }

            // Wallpaper Engine sends only the properties that changed (all of them on first load).
            var propertyHandlers = {
                mode: function (v) {
                    appState.mode = (v === 'shell') ? 'shell' : 'swarm';
                    requestSceneRender(true);
                },
                density: function (v) {
                    appState.collectorCount = Math.max(300, Math.min(appState.maxCollectors, Math.round(num(v, 1600))));
                    requestSceneRender(true);
                },
                radius: function (v) {
                    appState.orbitalRadius = Math.max(0.6, Math.min(1.75, num(v, 1)));
                    requestSceneRender(true);
                },
                intensity: function (v) {
                    appState.starIntensity = Math.max(0.4, Math.min(2.2, num(v, 1)));
                    requestSceneRender(false);
                },
                motion: function (v) {
                    appState.collectorMotion = Boolean(v);
                    requestSceneRender(false);
                },
                motionspeed: function (v) {
                    appState.timeScale = Math.max(0, num(v, 1));
                },
                orbits: function (v) {
                    appState.showOrbitalPaths = Boolean(v);
                    requestSceneRender(false);
                },
                autorotate: function (v) {
                    appState.autoRotate = Boolean(v);
                    requestSceneRender(false);
                },
                rotatespeed: function (v) {
                    cameraCtrl.autoRotateSpeed = Math.max(0, num(v, 1));
                },
                idledelay: function (v) {
                    cameraCtrl.idleDelayMs = Math.max(0, num(v, 1.2)) * 1000;
                },
                interactive: function (v) {
                    cameraCtrl.enabled = Boolean(v);
                    canvas.style.cursor = cameraCtrl.enabled ? '' : 'default';
                },
                inertia: function (v) {
                    cameraCtrl.inertia = Boolean(v);
                },
                zoom: function (v) {
                    cameraCtrl.setDefaultDistance(num(v, 13.8));
                },
                quality: function (v) {
                    appState.pixelRatio = Math.max(0.5, Math.min(2.0, num(v, 1)));
                    if (activeRenderer && activeRenderer.resize) {
                        activeRenderer.resize(window.innerWidth, window.innerHeight);
                    }
                    requestSceneRender(false);
                },
                fps: function (v) {
                    fpsCap = Math.max(0, parseInt(v, 10) || 0);
                },
                vignette: function (v) {
                    vignetteEl.classList.toggle('off', !v);
                },
                debug: function (v) {
                    setDebug(Boolean(v));
                }
            };

            function applyProperties(props) {
                for (var key in props) {
                    if (!Object.prototype.hasOwnProperty.call(props, key)) continue;
                    var handler = propertyHandlers[key];
                    var entry = props[key];
                    if (handler && entry && typeof entry.value !== 'undefined') {
                        handler(entry.value);
                    }
                }
            }

            window.wallpaperPropertyListener = {
                applyUserProperties: applyProperties,
                // Fires when a fullscreen app / game / maximised window covers the wallpaper.
                setPaused: function (isPaused) {
                    weSuspended = Boolean(isPaused);
                    syncSuspend();
                }
            };

            /* --------------------------------------------------------------------------
             * DEMAND-DRIVEN REQUESTANIMATIONFRAME LOOP (with optional FPS cap)
             * -------------------------------------------------------------------------- */
            function viewportFit() {
                // Keep the whole structure in frame on portrait / narrow displays.
                var aspect = window.innerWidth / Math.max(1, window.innerHeight);
                return aspect < 1.0 ? Math.pow(1.0 / aspect, 0.8) : 1.0;
            }

            // Schedule the next frame. With an FPS cap we sleep on a timer first, so no rAF
            // callbacks (and no wake-ups) are spent on frames that would just be skipped.
            function queueNextFrame() {
                if (fpsCap > 0) {
                    var wait = (1000.0 / fpsCap) - (performance.now() - lastFrameTime) - 3.0;
                    if (wait > 1.0) {
                        timerId = setTimeout(function () {
                            timerId = null;
                            if (!appState.tabHidden) {
                                rafId = requestAnimationFrame(animate);
                            }
                        }, wait);
                        return;
                    }
                }
                rafId = requestAnimationFrame(animate);
            }

            function animate(now) {
                rafId = null;

                if (appState.tabHidden) {
                    return;
                }

                var dt = Math.min(0.05, Math.max(0.001, (now - lastFrameTime) / 1000.0));
                lastFrameTime = now;

                var effectiveAutoRotate = appState.autoRotate && !appState.paused;
                var cameraStillMoving = cameraCtrl.update(dt, effectiveAutoRotate);
                var sceneAnimating = !appState.paused;

                if (sceneAnimating || cameraStillMoving || appState.needsRender) {
                    var camPos = cameraCtrl.getCartesianPosition();
                    var fit = viewportFit();
                    camPos.x *= fit; camPos.y *= fit; camPos.z *= fit;
                    var isMorphing = activeRenderer.updateAndRender(dt, camPos);
                    appState.needsRender = Boolean(isMorphing);
                }

                if (!appState.tabHidden && (sceneAnimating || cameraStillMoving || appState.needsRender)) {
                    queueNextFrame();
                }
            }

            scheduleLoop();
        })();
    </script>
</body>

</html>
