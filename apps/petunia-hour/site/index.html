<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petunia Hour</title>
<meta name="description" content="A bed of petunias at sunset. Brush the petals, click a flower, and let the wind do the rest.">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #1d1020; overflow: hidden; overscroll-behavior: none; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: none; }
  .title { position: fixed; left: max(20px, env(safe-area-inset-left)); top: max(16px, env(safe-area-inset-top)); color: #fff1dc;
    font: italic 500 22px Georgia, "Times New Roman", serif; letter-spacing: .02em; text-shadow: 0 1px 14px rgba(50,10,50,.7); pointer-events: none; opacity: .92; }
  .title small { display: block; margin-top: 3px; font: 500 10.5px system-ui, sans-serif; letter-spacing: .22em; text-transform: uppercase; opacity: .72; font-style: normal; }
  .hint { position: fixed; left: 50%; bottom: max(26px, env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 9px 18px; border-radius: 999px;
    background: rgba(35, 14, 40, .42); color: #ffe8cf; font-size: 13px; letter-spacing: .03em; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    pointer-events: none; transition: opacity 1.4s ease; white-space: nowrap; }
  .hint.gone { opacity: 0; }
  .panel { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); display: flex; gap: 18px; align-items: center;
    padding: 10px 18px; border-radius: 999px; background: rgba(35, 14, 40, .42); color: #ffe8cf; font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .panel label { display: flex; align-items: center; gap: 10px; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 96px; height: 3px; border-radius: 3px; background: rgba(255, 220, 180, .35); outline: none; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #ffd9a6; box-shadow: 0 0 10px rgba(255,190,120,.9); border: 0; }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #ffd9a6; box-shadow: 0 0 10px rgba(255,190,120,.9); border: 0; }
  @media (max-width: 720px) {
    .panel { left: 12px; right: 12px; justify-content: space-between; gap: 10px; padding: 9px 14px; bottom: max(12px, env(safe-area-inset-bottom)); }
    input[type=range] { width: 70px; }
    .hint { bottom: 70px; font-size: 12px; }
    .title { font-size: 19px; }
  }
</style>
</head>
<body>
<canvas id="c" aria-label="A bed of petunias at sunset. Move the pointer over the flowers to brush the petals; click or tap a flower to make petals fly."></canvas>
<div class="title">Petunia Hour<small>brush the petals &middot; let the wind move</small></div>
<div class="hint" id="hint">Touch the flowers</div>
<div class="panel">
  <label>Wind <input id="wind" type="range" min="0" max="100" value="55" aria-label="Wind strength"></label>
  <label>Sunset <input id="dusk" type="range" min="0" max="100" value="38" aria-label="How far the sun has set"></label>
</div>
<script src="flowers-data.js"></script>
<script>
(() => {
'use strict';
const D = window.PETUNIA_DATA;
const SW = D.W, SH = D.H, TAU = Math.PI * 2;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });   // opaque: the scene repaints every pixel, so blending against the page is wasted work
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
let seed = 90210;
const rnd = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const R_ = (a, b) => a + (b - a) * rnd();

const state = { wind: 0.55, dusk: 0.38 };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduceMotion) state.wind = 0.3;

// ---------------------------------------------------------------- noise & wind
const PERM = new Uint8Array(512);
{ const p = Array.from({ length: 256 }, (_, i) => i); for (let i = 255; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) PERM[i] = p[i & 255]; }
const h2 = (x, y) => PERM[PERM[x & 255] + (y & 255)] / 255;
function vnoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  return lerp(lerp(h2(ix, iy), h2(ix + 1, iy), u), lerp(h2(ix, iy + 1), h2(ix + 1, iy + 1), u), v);
}
let WS = 0, WA = Math.PI;                       // wind strength / direction at the last sampled point
function windAt(x, y, t) {
  // gusts are bands of noise that travel right -> left across the bed
  const g = vnoise(x * 0.0028 + t * 0.33, y * 0.0036 + t * 0.045);
  const gust = smooth((g - 0.36) / 0.42);
  const base = 0.28 + 0.12 * Math.sin(t * 0.37 + y * 0.002);
  WS = state.wind * (base + 1.05 * gust);
  WA = Math.PI + 0.2 + 0.32 * Math.sin(t * 0.21 + x * 0.0015);
}

// ---------------------------------------------------------------- sprites
const PL = 100, PH = 150, POX = 8, POY = 75;
const PAL = {
  0: { stops: [[0, '#8fb050'], [0.13, '#d6e39e'], [0.34, '#f3f3e8'], [1, '#fffefa']], vein: 'rgba(110,150,80,0.32)', throat: ['#6b9628', '#b4cf62', 'rgba(244,246,222,0)'], star: 'rgba(90,130,40,0.5)' },
  1: { stops: [[0, '#080320'], [0.18, '#150f66'], [0.5, '#2430c0'], [1, '#4658ee']], vein: 'rgba(4,4,50,0.5)', throat: ['#06021a', '#1a1270', 'rgba(40,52,200,0)'], star: 'rgba(170,180,255,0.35)' },
  2: { stops: [[0, '#4e0430'], [0.18, '#a90f5e'], [0.55, '#e22a8c'], [1, '#ff64b8']], vein: 'rgba(90,0,40,0.36)', throat: ['#44022a', '#9c0f56', 'rgba(232,42,142,0)'], star: 'rgba(40,0,20,0.4)' },
  3: { stops: [[0, '#350007'], [0.18, '#9c0b20'], [0.55, '#d81f36'], [1, '#f2485c']], vein: 'rgba(60,0,10,0.42)', throat: ['#2a0005', '#860a1c', 'rgba(220,32,56,0)'], star: 'rgba(30,0,4,0.4)' },
  4: { stops: [[0, '#350007'], [0.18, '#a30c22'], [0.55, '#dc2238'], [1, '#f4485e']], vein: 'rgba(60,0,10,0.4)', throat: ['#c7d985', '#f1f3cf', 'rgba(255,255,255,0)'], star: 'rgba(120,150,60,0.4)' },
};
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function petalPath(g) {
  const half = 0.66, L = PL, x0 = Math.cos(half) * L * 0.97, y0 = Math.sin(half) * L * 0.97;
  g.beginPath(); g.moveTo(0, 0); g.lineTo(x0, -y0);
  g.bezierCurveTo(L * 1.2, -y0 * 0.7, L * 1.2, y0 * 0.7, x0, y0); g.closePath();
  return [x0, y0];
}
function makePetal(type, sz) {
  const c = mk(Math.ceil((PL + 22) * sz), Math.ceil(PH * sz)), g = c.getContext('2d'), P = PAL[type];
  g.scale(sz, sz); g.translate(POX, POY);
  const [x0, y0] = petalPath(g);
  const rg = g.createRadialGradient(0, 0, 0, 0, 0, PL * 1.0);
  for (const [o, col] of P.stops) rg.addColorStop(o, col);
  g.fillStyle = rg; g.fill();
  g.save(); g.clip();
  if (type === 4) {                                  // white star stripe down the middle of each petal
    g.shadowColor = 'rgba(255,255,255,.9)'; g.shadowBlur = 5; g.fillStyle = 'rgba(255,250,248,0.95)';
    g.beginPath(); g.moveTo(PL * 0.06, -3); g.quadraticCurveTo(PL * 0.5, -PL * 0.17, PL * 0.93, -PL * 0.035); g.lineTo(PL * 0.93, PL * 0.035); g.quadraticCurveTo(PL * 0.5, PL * 0.17, PL * 0.06, 3); g.closePath(); g.fill();
    g.shadowBlur = 0;
  }
  const sh = g.createLinearGradient(0, -y0, 0, y0);               // each lobe is a touch darker at its sides so overlaps read
  sh.addColorStop(0, 'rgba(10,0,20,0.38)'); sh.addColorStop(0.16, 'rgba(10,0,20,0.04)'); sh.addColorStop(0.5, 'rgba(255,255,255,0.05)'); sh.addColorStop(0.84, 'rgba(10,0,20,0.02)'); sh.addColorStop(1, 'rgba(10,0,20,0.28)');
  g.fillStyle = sh; g.fillRect(-10, -PH, PL + 30, PH * 2);
  const ed = g.createRadialGradient(0, 0, PL * 0.62, 0, 0, PL * 1.08);   // thin petals glow a little at the margin
  ed.addColorStop(0, 'rgba(255,255,255,0)'); ed.addColorStop(1, type === 1 ? 'rgba(170,190,255,0.22)' : 'rgba(255,255,255,0.16)');
  g.fillStyle = ed; g.fillRect(-10, -PH, PL + 30, PH * 2);
  g.strokeStyle = P.vein; g.lineWidth = 1.5;
  for (let j = -3; j <= 3; j++) { const a = j * 0.16; g.beginPath(); g.moveTo(Math.cos(a) * PL * 0.1, Math.sin(a) * PL * 0.1); g.quadraticCurveTo(PL * 0.5, Math.sin(a) * PL * 0.42, Math.cos(a) * PL * 0.93, Math.sin(a) * PL * 0.8); g.stroke(); }
  g.restore();
  petalPath(g); g.strokeStyle = 'rgba(0,0,0,0.14)'; g.lineWidth = 1; g.stroke();
  // rim-light twin: only the outer margin, drawn additively when the petal faces the sun
  const r = mk(Math.ceil((PL + 22) * sz), Math.ceil(PH * sz)), rg2 = r.getContext('2d');
  rg2.scale(sz, sz); rg2.translate(POX, POY);
  rg2.beginPath(); rg2.moveTo(x0, -y0); rg2.bezierCurveTo(PL * 1.2, -y0 * 0.7, PL * 1.2, y0 * 0.7, x0, y0);
  rg2.lineCap = 'round'; rg2.strokeStyle = 'rgba(255,226,170,0.95)'; rg2.lineWidth = 3.6; rg2.shadowColor = 'rgba(255,190,110,0.95)'; rg2.shadowBlur = 9 * sz; rg2.stroke();
  return { base: c, rim: r, s: sz };
}
function makeThroat(type) {
  const c = mk(64, 64), g = c.getContext('2d'), T = PAL[type].throat;
  const rg = g.createRadialGradient(32, 32, 0, 32, 32, 31);
  rg.addColorStop(0, T[0]); rg.addColorStop(0.55, T[1]); rg.addColorStop(1, T[2]);
  g.fillStyle = rg; g.beginPath(); g.arc(32, 32, 31, 0, TAU); g.fill();
  g.strokeStyle = PAL[type].star; g.lineWidth = 3.2; g.lineCap = 'round';
  for (let i = 0; i < 5; i++) { const a = i * TAU / 5 + 0.31; g.beginPath(); g.moveTo(32 + Math.cos(a) * 5, 32 + Math.sin(a) * 5); g.lineTo(32 + Math.cos(a) * 27, 32 + Math.sin(a) * 27); g.stroke(); }
  g.fillStyle = 'rgba(255,238,160,0.9)';
  for (let i = 0; i < 4; i++) { g.beginPath(); g.arc(32 + (i - 1.5) * 2.6, 32 + ((i * 7) % 3 - 1) * 2, 1.7, 0, TAU); g.fill(); }
  return c;
}
function radialSprite(size, stops) {
  const c = mk(size, size), g = c.getContext('2d'), h = size / 2, rg = g.createRadialGradient(h, h, 0, h, h, h);
  for (const [o, col] of stops) rg.addColorStop(o, col);
  g.fillStyle = rg; g.fillRect(0, 0, size, size); return c;
}
const PET = {}, THR = {};
// three sizes per petal: small flowers sample a small sprite instead of shrinking a big one every frame
for (let t = 0; t < 5; t++) { PET[t] = [makePetal(t, 1), makePetal(t, 0.5), makePetal(t, 0.28)]; THR[t] = makeThroat(t); }
const leafSprites = new Map();
function leafSprite(r, g, b) {
  const q = (v) => ((v >> 4) << 4) + 8, key = (q(r) << 16) | (q(g) << 8) | q(b);
  let c = leafSprites.get(key); if (c) return c;
  c = mk(44, 24); const x = c.getContext('2d');
  x.fillStyle = `rgb(${q(r)},${q(g)},${q(b)})`; x.beginPath(); x.moveTo(0, 12); x.quadraticCurveTo(22, -2, 44, 12); x.quadraticCurveTo(22, 26, 0, 12); x.fill();
  x.strokeStyle = 'rgba(255,255,220,0.18)'; x.lineWidth = 1; x.beginPath(); x.moveTo(3, 12); x.lineTo(38, 12); x.stroke();
  leafSprites.set(key, c); return c;
}
let AO = radialSprite(64, [[0, 'rgba(14,6,22,0.58)'], [0.55, 'rgba(14,6,22,0.34)'], [1, 'rgba(14,6,22,0)']]);
let GLOW = radialSprite(64, [[0, 'rgba(255,196,120,0.9)'], [0.4, 'rgba(255,170,90,0.35)'], [1, 'rgba(255,150,80,0)']]);
let POLLEN = radialSprite(16, [[0, 'rgba(255,240,160,1)'], [0.4, 'rgba(255,205,90,0.7)'], [1, 'rgba(255,190,60,0)']]);
let MOTE = radialSprite(16, [[0, 'rgba(255,236,200,1)'], [0.35, 'rgba(255,214,160,0.55)'], [1, 'rgba(255,200,140,0)']]);

// ---------------------------------------------------------------- world
const flowers = D.flowers.map(([x, y, r, c]) => {
  let type = c;
  if (c === 3 && x < 620 && y > 400 && !(x < 60 && y > 880)) type = 4;     // the left-hand reds are the white-striped ones
  const R = clamp(r * 1.3, 19, 76);
  const f = { x, y, R, type, rot: rnd() * TAU, ox: 0, oy: 0, vx: 0, vy: 0, live: false, liveUntil: 0, puff: 0, hover: 0, lit: 0.5, sunAng: 0, ph: rnd() * TAU, z: y + R * 0.35 + rnd() * 8, petals: [] };
  for (let i = 0; i < 5; i++) f.petals.push({ a: i * TAU / 5 + (rnd() - 0.5) * 0.2, th: 0, w: 0, grow: 1, regrow: 0, len: 0.92 + rnd() * 0.14, ph: rnd() * TAU });
  return f;
}).sort((a, b) => a.z - b.z);

const leaves = D.leaves.map(([x, y, r, g, b]) => {
  const k = 0.82 + rnd() * 0.36, L = R_(22, 38), W = L * R_(0.28, 0.4);
  return { x, y, a0: rnd() * TAU, L, ky: (W / L) / 0.32, ph: rnd() * TAU, spr: leafSprite(clamp(r * k * 1.05, 0, 255) | 0, clamp(g * k * 1.12, 0, 255) | 0, clamp(b * k, 0, 255) | 0) };
}).sort((a, b) => a.y - b.y);

const loose = [], pollen = [], rings = [];
const motes = Array.from({ length: 70 }, () => ({ x: rnd() * SW, y: rnd() * SH, s: R_(0.6, 1.6), ph: rnd() * TAU, v: R_(4, 14) }));
const shades = Array.from({ length: 30 }, () => ({ x: rnd() * SW, y: rnd() * SH * 0.95, r: R_(50, 130), ph: rnd() * TAU, sp: R_(0.18, 0.45), a: R_(0.25, 0.6) }));
const RAYS = Array.from({ length: 9 }, (_, k) => ({ off: (k / 8 - 0.5) * 0.9 + (rnd() - 0.5) * 0.08, hw: R_(0.016, 0.05), amp: R_(0.5, 1), ph: rnd() * TAU, sp: R_(0.2, 0.5) }));

// ---------------------------------------------------------------- sun & light
let sunX = 0, sunY = 0, thetaC = 0, lightCol = [255, 200, 130];
function updateSun() {
  const d = state.dusk;
  sunX = SW * 1.22; sunY = lerp(-0.28 * SH, 0.52 * SH, d);
  thetaC = Math.atan2(SH * 0.5 - sunY, SW * 0.45 - sunX);
  lightCol = d < 0.5 ? mix3([255, 214, 150], [255, 160, 96], d / 0.5) : mix3([255, 160, 96], [244, 104, 118], (d - 0.5) / 0.5);
}
function rayI(psi, t) {
  let I = 0;
  for (const r of RAYS) { const d = (psi - (thetaC + r.off + 0.015 * Math.sin(t * 0.12 + r.ph))) / r.hw; if (d > -3 && d < 3) I += r.amp * (0.62 + 0.38 * Math.sin(t * r.sp + r.ph)) * Math.exp(-d * d); }
  return I > 1 ? 1 : I;
}

// ---------------------------------------------------------------- background (static)
const bg = mk(2, 2), baseCv = mk(D.gw, D.gh);
{ const bin = atob(D.base), id = baseCv.getContext('2d').createImageData(D.gw, D.gh);
  for (let i = 0; i < D.gw * D.gh; i++) { id.data[i * 4] = bin.charCodeAt(i * 3); id.data[i * 4 + 1] = bin.charCodeAt(i * 3 + 1); id.data[i * 4 + 2] = bin.charCodeAt(i * 3 + 2); id.data[i * 4 + 3] = 255; }
  baseCv.getContext('2d').putImageData(id, 0, 0); }
// Phones and Firefox (software-heavy canvas) start one tier lower; the frame loop raises or lowers it from real frame times.
const UA = navigator.userAgent, isMobile = matchMedia('(pointer: coarse)').matches || /Android|iPhone|iPad|Mobile/i.test(UA), isFirefox = /Firefox\//.test(UA);
let vw = 0, vh = 0, dpr = 1, scale = 1, offX = 0, offY = 0, K = 1, OX = 0, OY = 0, bgScale = 1, quality = isMobile || isFirefox ? 1 : 2, ceiling = 2;
const vis = { x0: 0, y0: 0, x1: SW, y1: SH };           // scene-space rectangle that is actually on screen

function terracotta(g, x0, x1, rimTop, rimBot, bodyBot) {
  const w = x1 - x0;
  const bd = g.createLinearGradient(x0, 0, x1, 0);
  bd.addColorStop(0, '#8a4125'); bd.addColorStop(0.45, '#c0663f'); bd.addColorStop(1, '#9a4a2b');
  g.fillStyle = bd; g.beginPath(); g.moveTo(x0 + 7, rimBot); g.lineTo(x1 - 7, rimBot); g.lineTo(x1 - w * 0.13, bodyBot); g.lineTo(x0 + w * 0.13, bodyBot); g.closePath(); g.fill();
  const rm = g.createLinearGradient(0, rimTop, 0, rimBot);
  rm.addColorStop(0, '#d98a5e'); rm.addColorStop(0.4, '#c56943'); rm.addColorStop(1, '#a8532f');
  g.fillStyle = rm; g.beginPath(); g.roundRect(x0, rimTop, w, rimBot - rimTop, 4); g.fill();
  g.fillStyle = 'rgba(0,0,0,0.28)'; g.fillRect(x0 + 6, rimBot, w - 12, 4);
  g.fillStyle = 'rgba(255,220,180,0.3)'; g.fillRect(x0 + 3, rimTop + 2, w - 6, 2);
}
function whitePot(g, cx, rimY, rx, bodyH, bucket) {
  const x0 = cx - rx, x1 = cx + rx, tap = bucket ? 0.9 : 0.72;
  const bd = g.createLinearGradient(x0, 0, x1, 0);
  bd.addColorStop(0, '#b9b8b2'); bd.addColorStop(0.4, '#f1efe8'); bd.addColorStop(1, '#c5c2ba');
  g.fillStyle = bd; g.beginPath(); g.moveTo(x0, rimY); g.lineTo(x1, rimY); g.lineTo(cx + rx * tap, rimY + bodyH); g.lineTo(cx - rx * tap, rimY + bodyH); g.closePath(); g.fill();
  if (bucket) { g.strokeStyle = 'rgba(80,78,70,0.25)'; g.lineWidth = 2; for (let y = rimY + 30; y < rimY + bodyH; y += 26) { g.beginPath(); g.moveTo(x0 + 6, y); g.lineTo(x1 - 6, y); g.stroke(); } }
  g.fillStyle = '#f6f4ee'; g.beginPath(); g.ellipse(cx, rimY, rx + 5, 13, 0, 0, TAU); g.fill();
  g.fillStyle = '#2a2a22'; g.beginPath(); g.ellipse(cx, rimY + 1, rx - 6, 8, 0, 0, TAU); g.fill();
}
function buildBG() {
  bgScale = Math.min(K, 3200 / SW);
  bg.width = Math.ceil(SW * bgScale); bg.height = Math.ceil(SH * bgScale);
  const g = bg.getContext('2d');
  g.setTransform(bgScale, 0, 0, bgScale, 0, 0);
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.fillStyle = '#0c1209'; g.fillRect(0, 0, SW, SH);
  if ('filter' in g) g.filter = `blur(${(D.cell * 0.55 * bgScale).toFixed(1)}px)`;
  g.drawImage(baseCv, 0, 0, D.gw * D.cell, D.gh * D.cell);
  g.filter = 'none';
  g.fillStyle = 'rgba(6,10,6,0.42)'; g.fillRect(0, 96, SW, SH);
  // black slatted bench where the base colour is very dark
  const px = baseCv.getContext('2d').getImageData(0, 0, D.gw, D.gh).data;
  for (let gy = 0; gy < D.gh; gy++) for (let gx = 0; gx < D.gw; gx++) {
    const i = (gy * D.gw + gx) * 4, lum = px[i] * 0.3 + px[i + 1] * 0.59 + px[i + 2] * 0.11, x0 = gx * D.cell, y0 = gy * D.cell;
    if (y0 < 430 || lum > 62) continue;
    g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(x0 - 1, y0 + 3, D.cell + 2, 8);
    g.fillStyle = 'rgba(96,102,92,0.16)'; g.fillRect(x0 - 1, y0 + 12, D.cell + 2, 2);
  }
  // wall above the pots
  const wl = g.createLinearGradient(0, 0, 0, 90); wl.addColorStop(0, '#d9ddcf'); wl.addColorStop(1, '#c4c9b9');
  g.fillStyle = wl; g.fillRect(0, 0, SW, 84);

    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 2.2); g.addColorStop(0, 'rgba(255,230,190,0.55)'); g.addColorStop(1, 'rgba(255,200,140,0)');

}
function render(t) {

  sceneT(); ctx.drawImage(bgBitmap || bg, 0, 0, SW, SH);
  drawLeaves(t); drawFlowers(t); drawParticles(t);
  drawLighting(t); drawCursor();
}

// ---------------------------------------------------------------- loop & UI
function resize() {
  vw = innerWidth; vh = innerHeight;
  const budget = quality >= 2 ? 3.4e6 : quality === 1 ? 1.6e6 : 0.8e6;     // device pixels the canvas may use at this tier
  dpr = clamp(Math.min(devicePixelRatio || 1, 2, Math.sqrt(budget / (vw * vh))), 0.6, 2);
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  scale = Math.max(vw / SW, vh / SH); offX = (vw - SW * scale) / 2; offY = (vh - SH * scale) / 2;
  K = scale * dpr; OX = offX * dpr; OY = offY * dpr;
  vis.x0 = -offX / scale; vis.x1 = (vw - offX) / scale; vis.y0 = -offY / scale; vis.y1 = (vh - offY) / scale;
  sizeMaps(); buildBG();
  if (typeof createImageBitmap === 'function') { const token = ++bgToken; bgBitmap = null; createImageBitmap(bg).then((b) => { if (token === bgToken) bgBitmap = b; }).catch(() => {}); }
}
function setQuality(q) { if (q === quality) return; quality = q; resize(); }
let resizeTimer = 0;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 120); });
let last = 0, clock = 0, paused = false, acc = 0, n = 0, windows = 0, fast = 0, slowRun = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (paused) { last = ts; return; }
  const raw = ts - (last || ts);
  if (quality === 0 && raw < 30) return;                    // lowest tier renders at ~30 fps and keeps the time it saves
  last = ts;
  const dt = clamp(raw / 1000, 0.001, quality === 0 ? 0.05 : 0.033);
  clock += dt; now = clock;
  update(dt, clock); render(clock);
  // adaptive quality from real frame pacing; gaps over 250 ms mean a throttled or backgrounded tab, not a slow scene
  if (raw < 250) { acc += raw; n++; slowRun = raw > 50 ? slowRun + 1 : 0; } else slowRun = 0;
  const drop = () => { setQuality(quality - 1); ceiling = quality; acc = 0; n = 0; windows = 1; fast = 0; slowRun = 0; };
  if (slowRun >= 8 && quality > 0) { drop(); return; }
  if (n >= 30) {
    const avg = acc / n; acc = 0; n = 0; windows++;
    if (windows > 2) {
      if (avg > 23 && quality > 0) drop();
      else if (avg < 18.5 && quality < ceiling) { if (++fast >= 4) { setQuality(quality + 1); fast = 0; windows = 1; } }
      else fast = 0;
    }

}
document.addEventListener('visibilitychange', () => { paused = document.hidden; });
function hideHint() { document.getElementById('hint').classList.add('gone'); }
setTimeout(hideHint, 9000);
const wEl = document.getElementById('wind'), dEl = document.getElementById('dusk');
wEl.value = Math.round(state.wind * 100);
wEl.addEventListener('input', () => { state.wind = wEl.value / 100; });
dEl.addEventListener('input', () => { state.dusk = dEl.value / 100; });
for (const el of [wEl, dEl]) el.addEventListener('pointerdown', (e) => e.stopPropagation());
function bench(n = 30) {
  const out = {}; let tu = 0, tr = 0;
  for (let i = 0; i < n; i++) {
    let a = performance.now(); update(1 / 60, clock += 1 / 60); tu += performance.now() - a;
    a = performance.now(); render(clock); ctx.getImageData(0, 0, 1, 1); tr += performance.now() - a;
  }
  return { updateMs: +(tu / n).toFixed(2), renderMs: +(tr / n).toFixed(2), canvas: cv.width + 'x' + cv.height, dpr, quality };
}
window.__petunia = { bench, state, flowers, burst, pointers, get quality() { return quality; }, set quality(v) { ceiling = Math.max(ceiling, v); setQuality(v); } };

// Sprites are drawn thousands of times a frame. ImageBitmaps are immutable GPU/CPU surfaces; drawing from <canvas>
// elements makes Firefox re-validate the source on every call.
let bgBitmap = null, bgToken = 0;
async function freezeSprites() {
  if (typeof createImageBitmap !== 'function') return;
  const bm = (c) => createImageBitmap(c);
  for (const t in PET) for (const l of PET[t]) { l.base = await bm(l.base); l.rim = await bm(l.rim); }
  for (const t in THR) THR[t] = await bm(THR[t]);
  AO = await bm(AO); GLOW = await bm(GLOW); POLLEN = await bm(POLLEN); MOTE = await bm(MOTE);
  const frozen = new Map();
  for (const [k, c] of leafSprites) frozen.set(c, await bm(c));
  for (const l of leaves) l.spr = frozen.get(l.spr) || l.spr;
}
updateSun(); resize();
for (let i = 0; i < 40; i++) update(1 / 30, i / 30);   // let the wind settle before the first frame
freezeSprites().catch(() => {}).then(() => requestAnimationFrame(frame));
})();
</script>
