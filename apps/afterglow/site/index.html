      if (!pointerLocked) releaseKeys();                 // Esc / alt-tab: come to a gentle stop
      showHint();
    }
    function showHint() {
      if (!started) { hintEl.classList.remove('show'); return; }
      clearTimeout(hintTimer);
      if (pointerLocked) {
        hintEl.textContent = 'W / S  walk   ·   Mouse  look   ·   Esc  release';
        hintEl.classList.add('show');
        hintTimer = setTimeout(() => hintEl.classList.remove('show'), 5500);   // then leave the view clean
      } else {
        hintEl.textContent = 'Click to look around   ·   W / S  to walk';
        hintEl.classList.add('show');
      }
    }

    /* Moves the player and returns the SIGNED distance actually travelled along the path this frame. */
    const _previous = new THREE.Vector3();
    function updatePlayer(dt, time) {
      const input = started ? (keys.forward ? 1 : 0) - (keys.backward ? 1 : 0) : 0;
      const rate = input !== 0 ? C.ACCELERATION : C.DECELERATION;
      player.velocity += (input * C.WALK_SPEED - player.velocity) * (1 - Math.exp(-dt * rate));
      if (input === 0 && Math.abs(player.velocity) < 0.02) player.velocity = 0;      // come to a true, complete stop

      _previous.copy(player.position);
      player.position.addScaledVector(PATH_DIRECTION, player.velocity * dt);   // only ever along the fixed path direction
      player.position.x = 0;
      player.position.y = pathBaseHeight(player.position.z);
      const dx = player.position.x - _previous.x, dz = player.position.z - _previous.z;
      const signedDistance = dx * PATH_DIRECTION.x + dz * PATH_DIRECTION.z;    // + forward, - backward, 0 at rest
      player.stride += signedDistance;
      player.distanceWalked += Math.abs(signedDistance);

      // View: smoothed mouse look (plus a barely perceptible drift while the intro is showing).
      const k = 1 - Math.exp(-dt * C.LOOK_SMOOTHING);
      let yawT = player.yawTarget, pitchT = player.pitchTarget;
      if (!started) { yawT += Math.sin(time * 0.11) * 0.035; pitchT += Math.sin(time * 0.083 + 1.0) * 0.012; }
      player.yaw += (yawT - player.yaw) * k;
      player.pitch += (pitchT - player.pitch) * k;

      // Gentle head bob, scaled by actual speed so it fades in and out with the walk.
      const gait = Math.min(Math.abs(player.velocity) / C.WALK_SPEED, 1);
      const phase = player.stride / C.STRIDE_LENGTH * Math.PI;
      const bobY = Math.abs(Math.sin(phase)) * C.BOB_HEIGHT * gait - C.BOB_HEIGHT * 0.5 * gait;
      const bobX = Math.sin(phase) * C.BOB_SWAY * gait;
      camera.position.set(player.position.x + Math.cos(player.yaw) * bobX,
        player.position.y + C.EYE_HEIGHT + bobY,
        player.position.z - Math.sin(player.yaw) * bobX);
      camera.rotation.set(player.pitch, player.yaw, 0);
      return signedDistance;
    }

    /* =====================================================================================
       11. PLANET ROTATION SYSTEM  — the signature mechanic
       The planet's spin is a pure function of the distance the player has really moved:
         forward  -> clockwise         backward -> anticlockwise        standing still -> no rotation
       No timers, no key checks, and mouse look has no influence. Only planetBody.rotation.y changes;
       the planet's position, scale, axis and rings are never touched here.
       ===================================================================================== */
    function updatePlanetRotation(signedDistance) {
      if (signedDistance === 0) return;
      planetBody.rotation.y += planetSpinSign * C.PLANET_SPIN_DIRECTION * signedDistance * C.PLANET_ROTATION_PER_METRE;
    }

    /* =====================================================================================
       12. ENVIRONMENT ANIMATION
       Wind, cloud drift, star twinkle, flower pulse and motes are all driven by uTime inside the shaders.
       Here we only keep the "infinitely distant" things glued to the camera and the ground grid under the player.
       ===================================================================================== */
    function updateEnvironment(dt) {
      U.uTime.value += dt;
      skyDome.position.copy(camera.position);
      starField.position.copy(camera.position);
      cloudDome.position.copy(camera.position);
      // Fixed celestial direction: position follows the camera, orientation never does.
      planetRoot.position.copy(camera.position).addScaledVector(PLANET_DIR, C.PLANET_DISTANCE);
      planetUniforms.uPlanetCenter.value.copy(planetRoot.position);
      farTerrain.position.set(0, 0, player.position.z);
      ground.position.z = Math.round(player.position.z / C.GROUND_CELL) * C.GROUND_CELL;
    }

    /* =====================================================================================
       13. INTRODUCTION INTERFACE
       ===================================================================================== */
    function startExperience() {
      if (started) return;
      started = true;
      introEl.classList.add('hidden');
      canvas.focus({ preventScroll: true });
      requestLook();                 // allowed here because we are inside the button's click handler
      showHint();
    }

    /* =====================================================================================
       14. MAIN ANIMATION LOOP
       ===================================================================================== */
    const clock = new THREE.Clock();
    let running = false, frameHandle = 0;

    const quality = { level: 0, time: 0, frames: 0, grace: 2, pixelRatioCap: C.MAX_PIXEL_RATIO };
    function monitorPerformance(rawDt) {
      if (!C.ADAPTIVE_QUALITY || quality.level >= 3 || rawDt > 0.3) return;     // ignore tab switches
      quality.time += rawDt; quality.frames++;
      if (quality.time < 2.5) return;
      const fps = quality.frames / quality.time;
      quality.time = 0; quality.frames = 0;
      if (quality.grace > 0) { quality.grace--; return; }                       // let shaders compile first
      if (fps >= C.ADAPTIVE_MIN_FPS) return;
      quality.level++; quality.grace = 1;                                       // only ever steps down, so it cannot oscillate
      quality.pixelRatioCap = [C.MAX_PIXEL_RATIO, 1.0, 1.0, 0.8][quality.level];
      const density = [1, 1, 0.65, 0.45][quality.level];
      for (const mesh of thinnable) mesh.geometry.instanceCount = Math.floor(mesh.userData.count * density);
      onResize();
    }

    function frame() {
      frameHandle = requestAnimationFrame(frame);
      const rawDt = clock.getDelta();
      monitorPerformance(rawDt);
      const dt = Math.min(rawDt, 0.05);                       // clamp after tab switches
      const signedDistance = updatePlayer(dt, clock.elapsedTime);
      updatePlanetRotation(signedDistance);
      updateEnvironment(dt);
      composer.render();
    }

    /* =====================================================================================
       15. WINDOW RESIZING AND CLEANUP
       ===================================================================================== */
    function onResize() {
      const w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
      const pr = Math.min(window.devicePixelRatio || 1, quality.pixelRatioCap);
      renderer.setPixelRatio(pr);
      renderer.setSize(w, h, false);
      composer.setPixelRatio(pr);
      composer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      U.uPixelRatio.value = pr;
      U.uPxScale.value = (h * pr) / (2 * Math.tan(C.FOV * DEG / 2));   // world size -> pixels at 1 m
    }

    function dispose() {
      cancelAnimationFrame(frameHandle);
      window.removeEventListener('resize', onResize);
      window.removeEventListener('keydown', onKeyDown);
      window.removeEventListener('keyup', onKeyUp);
      window.removeEventListener('blur', releaseKeys);
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('pointerlockchange', onPointerLockChange);
      document.removeEventListener('pointerlockerror', onPointerLockChange);
      scene.traverse(o => {
        if (o.geometry) o.geometry.dispose();
        if (o.material) { for (const k in o.material.uniforms) { const v = o.material.uniforms[k].value; if (v && v.isTexture) v.dispose(); } o.material.dispose(); }
      });
      composer.dispose();
      renderer.dispose();
    }

    /* ---- Boot: build the world in a few steps so the title screen appears immediately ---- */
    async function init() {
      onResize();
      await nextFrame();
      U.uBiome.value = generateBiomeTexture();
      buildSky();
      buildMountains();
      await nextFrame();
      const planetTexture = generatePlanetTexture(C.PLANET_TEXTURE_WIDTH);
      await nextFrame();
      buildPlanet(planetTexture, generateRingTexture());
      buildGround();
      buildVegetation();
      buildBoulders();
      buildMotes();

      window.addEventListener('resize', onResize);
      window.addEventListener('keydown', onKeyDown);
      window.addEventListener('keyup', onKeyUp);
      window.addEventListener('blur', releaseKeys);
      window.addEventListener('pagehide', dispose, { once: true });
      window.addEventListener('pageshow', e => { if (e.persisted) location.reload(); });   // restored from the back/forward cache
      document.addEventListener('visibilitychange', () => { if (document.hidden) releaseKeys(); });
      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('pointerlockchange', onPointerLockChange);
      document.addEventListener('pointerlockerror', onPointerLockChange);
      canvas.addEventListener('click', () => { if (started && !pointerLocked) requestLook(); });
      canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); cancelAnimationFrame(frameHandle); });
      canvas.addEventListener('webglcontextrestored', () => { clock.getDelta(); frame(); });
      startBtn.addEventListener('click', startExperience);

      clock.start();
      running = true;
      frame();
      await nextFrame();
      startBtn.textContent = 'Start Exploring';
      startBtn.disabled = false;
      startBtn.focus({ preventScroll: true });
    }

    // Handy for tweaking from the browser console, e.g. AFTERGLOW.CONFIG or AFTERGLOW.player.
    window.AFTERGLOW = { CONFIG, player, camera, scene, renderer, quality, get planetBody() { return planetBody; }, get planetRoot() { return planetRoot; }, get ready() { return running; } };

    init().catch(err => {
      console.error(err);
      fatal('AFTERGLOW could not start: ' + (err && err.message ? err.message : err));
    });
  </script>
</body>

</html>
